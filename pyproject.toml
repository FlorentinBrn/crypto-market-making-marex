[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-mm-research-sandbox"
version = "2.0.0"
description = "Research sandbox for crypto market making, backtesting, and microstructure analytics."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Open project template" }]
dependencies = [
    "websocket-client>=1.6",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "rich>=13.0",
    "sortedcontainers>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
crypto-mm = "crypto_mm.main:main"
crypto-mm-analyze = "crypto_mm.analyze:main"
crypto-mm-backtest = "crypto_mm.backtest:main"
crypto-mm-clean = "crypto_mm.clean:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crypto_mm*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
